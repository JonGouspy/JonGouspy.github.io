name: Deploy React portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # User site (repository named <owner>.github.io): served from "/". Any other repository name
      # is a project site, served from "/<repository>/".
      - name: Set base path
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "${repo,,}" = "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]; then base="/"; else base="/$repo/"; fi
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
